# The complete declarative description of this cache.
#
# One file, read by both the shared orchestration and this cache's own update code, so the two
# cannot disagree. It replaces what used to be spread across `code/update_pipeline.sh` (the input
# subdataset URL, path and branch, the output file name, the entry point, the batch size), the
# update workflow (the image reference and a second batch size), `dataset_description.json`, and
# the constants at the top of `code/update.py`.

[cache]
name = "valid-nwb-file-to-chunk-stats"

# Upstream cache, registered as a DataLad input subdataset and pinned in every run's provenance,
# so each result records the exact input commit it was computed from.
#
# `lookup` because this cache reads it as one `{content_id: is_valid}` mapping and selects the
# entries marked valid.
[[inputs]]
name = "content-id-to-valid-nwb-file"

# Streaming and walking each file is heavy enough that a single run cannot clear the backlog, so a
# run advances it by a bounded batch. The workflow and the shell script each carried their own copy
# of this number; it is declared once here.
#
# Sized from this cache's own update logs, slow files included: resampling 11,817 timed items puts a
# run of 500 at about 91 minutes typically and 262 at the 99th percentile, inside the job's
# 330-minute timeout with margin. The margin matters, because a run that times out publishes nothing
# it did. It stays at 500: a few files here take over an hour each, so a larger batch is the one
# most likely to catch two of them.
[operations.update]
limit = 500
# A testing run streams whole NWB files from the archive, so two is already a minute or so of
# work and is enough to exercise the read, the walk, the error routing and the write.
testing_limit = 2

# The published branches describe this repository as a BIDS study dataset, through a
# `dataset_description.json` with `DatasetType: "study"`. The pipeline renders that file from this
# section at the start of every run, so the repository no longer carries it.
[description]
authors = ["Cody Baker"]
